<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
  <h1>Administration</h1>
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <p class="ok" th:if="${param.saved}">Retention saved.</p>
  <p class="ok" th:if="${param.purged}">Purge executed.</p>
  <div class="card">
    <h2>Request log retention</h2>
    <p class="muted">Logs older than this are deleted automatically every night (03:30 UTC).</p>
    <form th:action="@{/admin/retention}" method="post">
      <label for="days">Days to keep</label>
      <input type="number" id="days" name="days" min="1" max="3650" th:value="${retentionDays}" style="max-width:160px" required>
      <p><button type="submit">Save</button></p>
    </form>
    <form th:action="@{/admin/purge}" method="post" onsubmit="return confirm('Delete all logs older than the retention period now?');">
      <button class="secondary" type="submit">Run purge now</button>
    </form>
  </div>
  <div class="card">
    <h2>Users</h2>
    <table>
      <thead><tr><th>Username</th><th>Role</th><th>Timezone</th><th>Created</th></tr></thead>
      <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.username}"></td><td th:text="${u.role}"></td>
          <td th:text="${u.timezone}"></td><td th:text="${@fmt.dt(u.createdAt, tz)}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
