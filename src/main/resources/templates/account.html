<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Account')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
  <h1>Account <span class="muted" th:text="${user.username}"></span></h1>
  <p class="error" th:if="${param.forced}">You must change your password before you can continue.</p>
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <p class="ok" th:if="${param.saved}">Saved.</p>
  <div class="row">
    <div class="card">
      <h2>Change password</h2>
      <form th:action="@{/account/password}" method="post">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" name="currentPassword" required>
        <label for="newPassword">New password (min 8 characters)</label>
        <input type="password" id="newPassword" name="newPassword" required>
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm" required>
        <p><button type="submit">Change password</button></p>
      </form>
    </div>
    <div class="card">
      <h2>Display timezone</h2>
      <p class="muted">Everything is stored in UTC. This only changes how dates are shown.</p>
      <form th:action="@{/account/timezone}" method="post">
        <label for="timezone">Timezone</label>
        <select id="timezone" name="timezone">
          <option th:each="z : ${zones}" th:value="${z}" th:text="${z}" th:selected="${z == user.timezone}"></option>
        </select>
        <p><button type="submit">Save timezone</button></p>
      </form>
    </div>
  </div>
</main>
</body>
</html>
